<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Filtro Pixar · Floresta Encantada da Allana (v2)</title>
<style>
:root{--bg:#1b1030;--fg:#fff;--lil:#b57edc;--gold:#ffd86b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",system-ui,sans-serif;color-scheme:dark}
body{display:flex;flex-direction:column;align-items:center}
#stage{position:relative;flex:1;min-height:0;width:100%;display:flex;justify-content:center}
canvas{height:100%;max-width:100%;aspect-ratio:9/16;object-fit:contain;border-radius:18px}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:rgba(27,16,48,.82);border-radius:18px}
button{font:inherit;color:var(--fg);border:0;border-radius:999px;padding:10px 16px;background:#3a2561;cursor:pointer}
button.main{background:linear-gradient(135deg,#c79bf0,#8a55c8);font-weight:700;padding:12px 22px}
#bar{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;max-width:460px;padding:10px 14px 14px;box-sizing:border-box}
#shut{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:var(--lil);padding:0}
#shut.rec{background:#e5484d;border-radius:18px}
.tabs{display:flex;gap:4px}.tabs button{padding:8px 12px;font-size:14px}.tabs .on{background:var(--lil);color:#1b1030;font-weight:700}
#timer{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#e5484d;border-radius:999px;padding:3px 12px;font-size:14px;display:none}
#out{position:fixed;inset:0;background:rgba(15,8,28,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;box-sizing:border-box;z-index:5}
#out img,#out video{max-height:70%;max-width:100%;border-radius:14px}
#out small{opacity:.75;text-align:center}
</style></head><body>
<div id="stage">
 <canvas id="c"></canvas>
 <div id="timer">● 0s</div>
 <div id="msg"><div style="font-size:42px">🧚✨</div><b style="font-size:20px">Filtro Pixar da Floresta Encantada</b>
  <span style="opacity:.8">Ative a câmera para ver a mágica</span>
  <button class="main" id="go">Ativar câmera</button>
  <button id="pick">ou usar a câmera do celular</button></div>
</div>
<div id="bar">
 <button id="flip" title="Virar câmera">🔄</button>
 <div class="tabs"><button id="mFoto" class="on">Foto</button><button id="mVid">Vídeo</button></div>
 <button id="shut" aria-label="Capturar"></button>
 <button id="fx" class="on">✨ Pixar</button>
</div>
<input type="file" id="file" accept="image/*" capture="user" hidden>
<div id="out"></div>
<video id="v" playsinline muted style="display:none"></video>

function star(x,y,r,a,c){ctx.globalAlpha=a;ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x-r,y);ctx.lineTo(x+r,y);ctx.moveTo(x,y-r);ctx.lineTo(x,y+r);ctx.stroke();ctx.beginPath();ctx.arc(x,y,r/3,0,7);ctx.fill();ctx.globalAlpha=1}
function frame(t){
 if(FR)ctx.drawImage(FR,0,0);
 // brilho de pó de fada nas varinhas
 [[182,140],[168,160],[520,255],[500,275]].forEach((p,i)=>star(p[0]+Math.sin(t*2+i)*6,p[1]+Math.cos(t*2+i)*6,10+6*Math.sin(t*3+i*2),.5+.5*Math.sin(t*3+i),'#fff0b8'));
 // faíscas e borboletas
 spark.forEach(s=>{const a=.4+.6*Math.abs(Math.sin(t*2+s.p)),yy=(s.y-t*s.v+H*4)%H;
  star(s.x+Math.sin(t+s.p)*14,yy,s.r*1.6,a,s.c)});
 ctx.textAlign='center';
 emo.forEach(o=>{ctx.font=o.s+'px serif';ctx.fillText(o.e,o.x+Math.cos(t*.6+o.p)*o.v,o.y+Math.sin(t*.8+o.p)*o.v)});
 // placa de pergaminho
 const bx=190,by=1150,bw=340,bh=100;
 ctx.fillStyle='#f4e3b5';ctx.strokeStyle='#8a5a2b';ctx.lineWidth=5;
 ctx.beginPath();ctx.roundRect(bx,by,bw,bh,20);ctx.fill();ctx.stroke();
 [bx,bx+bw].forEach(x=>{ctx.beginPath();ctx.ellipse(x,by+bh/2,14,bh/2+8,0,0,7);ctx.fillStyle='#e6cf98';ctx.fill();ctx.stroke()});
 ctx.fillStyle='#5a3a1a';ctx.font='bold 34px Georgia,serif';ctx.fillText('Allana faz 7 anos',W/2,by+44);
 ctx.font='italic 22px Georgia,serif';ctx.fillStyle='#7a4fa8';ctx.fillText('Floresta Encantada ✨',W/2,by+78)}
function draw(now){
 const t=now/1000;
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle='#1b1030';ctx.fillRect(0,0,W,H);
 if(src){
  if(pix&&hasF)ctx.filter='saturate(1.35) contrast(1.06) brightness(1.08)';
  const ok=drawSrc();ctx.filter='none';
  if(ok&&pix){
   if(!hasF){ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.4;drawSrc()}
   // suavização de pele + brilho (cópia desfocada)
   ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;sx.drawImage(cv,0,0,small.width,small.height);
   ctx.imageSmoothingQuality='high';ctx.globalAlpha=.5;ctx.drawImage(small,0,0,W,H);
   ctx.globalCompositeOperation='screen';ctx.globalAlpha=.14;ctx.drawImage(small,0,0,W,H);
   // cor de cinema: lilás e dourado
   ctx.globalCompositeOperation='soft-light';ctx.globalAlpha=.55;
   const lg=ctx.createLinearGradient(0,0,W,H);lg.addColorStop(0,'#c58cff');lg.addColorStop(1,'#ffcf7a');ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);
   ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}}
 // vinheta
 const v=ctx.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.7);v.addColorStop(0,'rgba(40,10,70,0)');v.addColorStop(1,'rgba(40,10,70,.55)');
 ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
 frame(t);requestAnimationFrame(draw)}
requestAnimationFrame(draw);
async function start(){
 try{if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
  vid.srcObject=stream;await vid.play();src=vid;mirror=facing==='user';$('msg').style.display='none'}
 catch(e){$('msg').style.display='flex';$('msg').querySelector('span').textContent='Não consegui abrir a câmera aqui. Abra o link direto no navegador (Chrome/Safari) ou use a câmera do celular.'}}
$('go').onclick=start;$('flip').onclick=()=>{facing=facing==='user'?'environment':'user';start()};
$('pick').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();
 im.onload=()=>{src=im;mirror=false;$('msg').style.display='none'};im.src=URL.createObjectURL(f)};
$('fx').onclick=()=>{pix=!pix;$('fx').classList.toggle('on',pix);$('fx').style.opacity=pix?1:.6};
$('mFoto').onclick=()=>setMode('foto');$('mVid').onclick=()=>setMode('video');
function setMode(m){mode=m;$('mFoto').classList.toggle('on',m==='foto');$('mVid').classList.toggle('on',m==='video')}
function show(blob,isVid){
 const url=URL.createObjectURL(blob),o=$('out'),ext=isVid?(blob.type.includes('mp4')?'mp4':'webm'):'png',name='allana-floresta.'+ext;
 o.innerHTML=(isVid?`<video src="${url}" controls autoplay loop playsinline></video>`:`<img src="${url}">`)+
 `<div style="display:flex;gap:10px"><button class="main" id="sh">Salvar / Compartilhar</button><button id="cl">Voltar</button></div><small>Se não abrir o compartilhamento, segure o dedo sobre a ${isVid?'tela do vídeo':'foto'} para salvar.</small>`;
 o.style.display='flex';$('cl').onclick=()=>{o.style.display='none';o.innerHTML=''};
 $('sh').onclick=async()=>{const f=new File([blob],name,{type:blob.type});
  try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Floresta Encantada da Allana'});
   else{const a=document.createElement('a');a.href=url;a.download=name;a.click()}}catch(e){}}}
$('shut').onclick=async()=>{
 if(mode==='foto'){cv.toBlob(b=>show(b,false),'image/png');return}
 if(rec){rec.stop();return}
 const cs=cv.captureStream(30);
 try{const a=await navigator.mediaDevices.getUserMedia({audio:true});a.getAudioTracks().forEach(t=>cs.addTrack(t))}catch(e){}
 const type=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
 try{rec=new MediaRecorder(cs,type?{mimeType:type}:{})}catch(e){alert('Seu navegador não grava vídeo aqui. Tente abrir no Chrome ou Safari.');return}
 chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
 rec.onstop=()=>{clearInterval(tick);$('timer').style.display='none';$('shut').classList.remove('rec');
  cs.getAudioTracks().forEach(t=>t.stop());const b=new Blob(chunks,{type:rec.mimeType||'video/webm'});rec=null;show(b,true)};
 rec.start();$('shut').classList.add('rec');$('timer').style.display='block';let s=0;$('timer').textContent='● 0s';
 tick=setInterval(()=>{s++;$('timer').textContent='● '+s+'s';if(s>=30)rec&&rec.stop()},1000)};
</script></body></html>
